name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

  build:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        language: [java, python, c, cpp, javascript]
      steps:
        - uses: actions/checkout@v4
        
        - name: Build Docker image
          run: docker build -f Dockerfile.backend -t aio-compiler .
