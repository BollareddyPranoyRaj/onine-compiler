name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint]

    strategy:
      matrix:
        language: [java, python, c, cpp, javascript]

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Show current language
        run: echo "Testing ${{ matrix.language }}"   

      - name: Build Docker image for ${{ matrix.language }}
        run: docker build -f Dockerfile.backend -t bollareddypranoyraj/aio-compiler:${{ github.sha }} .

      - name: Push Docker image
        run: docker push bollareddypranoyraj/aio-compiler:${{ github.sha }}
